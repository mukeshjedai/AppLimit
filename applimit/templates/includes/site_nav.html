{% set p = request.scope.get("path") or "/" %}
<header id="site-nav" class="site-nav" role="banner">
  <a class="site-nav__brand" href="/">AppLimit</a>
  <div class="site-nav__main">
    <nav class="site-nav__links" aria-label="Main navigation">
      <a href="/" class="{% if p == '/' %}is-active{% endif %}">Translator</a>
      <a href="/insights" class="{% if p == '/insights' %}is-active{% endif %}">Insights</a>
      <a href="/flashcards" class="{% if p == '/flashcards' %}is-active{% endif %}">Flashcards</a>
      <a href="/wiki" class="{% if p == '/wiki' or (p.startswith('/wiki/') and not p.startswith('/wiki/paste')) %}is-active{% endif %}">Wiki</a>
      <a href="/wiki/paste" class="{% if p.startswith('/wiki/paste') %}is-active{% endif %}">Paste notes</a>
    </nav>
  </div>
</header>
<style>
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.65rem 1.25rem;
    padding: 0.6rem 1.25rem;
    background: #ffffff;
    box-shadow: 0 1px 0 rgba(15, 23, 42, 0.06);
  }
  .site-nav__brand {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
    color: #000000;
    text-decoration: none;
  }
  .site-nav__brand:hover { color: #000000; text-decoration: underline; }
  .site-nav__main {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.25rem;
    flex: 1;
    justify-content: flex-end;
  }
  .site-nav__links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.2rem;
  }
  .site-nav__links a {
    padding: 0.42rem 0.7rem;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 500;
    color: #000000;
    text-decoration: none;
  }
  .site-nav__links a:hover {
    color: #000000;
    background: #ffffff;
    text-decoration: underline;
  }
  .site-nav__links a.is-active {
    color: #000000;
    background: #ffffff;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 0.2em;
  }
</style>
