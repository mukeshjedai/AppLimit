# Deploy Python v2 Azure Functions app (FastAPI via AsgiFunctionApp)
# Docs: https://github.com/Azure/functions-action

name: Build and deploy Python project to Azure Function App - applimit-func-97195

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: applimit-func-97195
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "."
  PYTHON_VERSION: "3.11"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify function entrypoint imports
        run: |
          python -c "from function_app import app; print('function_app ok', type(app))"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AB7D2DA4532E4C80B80219A0BD76646E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F31C39235B6E460DA815ECFEA8984DEE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BDC47337C185439DB27D65AF53D49CAD }}

      # functions-action with OIDC was leaving WEBSITE_RUN_FROM_PACKAGE pointed
      # at the small source archive without its remotely built dependencies.
      # Core Tools performs the same remote Oryx build used by the verified
      # Windows deployment script and activates the resulting squashfs package.
      - name: Install Azure Functions Core Tools
        run: npm install --global azure-functions-core-tools@4 --unsafe-perm true

      - name: Deploy to Azure Functions with remote build
        run: func azure functionapp publish "${{ env.AZURE_FUNCTIONAPP_NAME }}" --python --build remote
